        <!--main container start-->
        <div class="main-container">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="#">Home</a></li>
              <li class="breadcrumb-item"><a href="#">Price</a></li>
              <li class="breadcrumb-item active" aria-current="page">Add Price</li>
              <li class="breadcrumb-item"><a href="#">Price List</a></li>
            </ol>
          </nav>
          <div class="container-fluid">
            <h6>Add Price</h6>
            <form [formGroup]="addPriceForm" (ngSubmit)="priceAdd()">
              <div class="form-row">
                <div class="form-group col-md-8">
                  <label for="exampleFormControlSelect4">Product Code<span class="notzerovalue">&nbsp;*</span></label>
                  <select [formControlName]="'productId'" class="form-control" id="exampleFormControlSelect2">
                    <option selected value="" disabled>Select Product Code ..</option>
                    <option *ngFor="let product of products |async" [value]="product.productId">
                      <span>Product Code:</span><span>{{product.barcode}}</span><span>&nbsp;&nbsp;Product Name:
                        {{product.productName}}</span>
                    </option>
                  </select>
                  <div class="invalid-feedback"
                    *ngIf="f.productId.touched && f.productId.hasError('required') ">
                    Please choose a Product Code.
                  </div>
                </div>
                <div class="form-group col-md-4">
                  <label for="exampleFormControlSelect2">Branch Location<span
                      class="notzerovalue">&nbsp;*</span></label>
                  <select class="form-control" [formControlName]="'branchLocationId'" id="exampleFormControlSelect2">
                    <option selected value="" disabled>Select Branch Location ..</option>
                    <option *ngFor="let branch of branches | async" [value]="branch.branchLocationId">{{branch.branchCode}}
                    </option>
                  </select>
                  <div class="invalid-feedback"
                    *ngIf="f.branchLocationId.touched && f.branchLocationId.hasError('required')">
                    Please choose a Branch Location.
                  </div>
                </div>
                <div class="form-group col-md-2">
                  <label for="ProductCode">Unit Price<span class="notzerovalue">&nbsp;*</span></label>
                  <input type="number" class="form-control" [formControlName]="'unitPrice'" id="" placeholder="">
                </div>
                <div class="form-group col-md-2">
                  <label for="ProductName">Maximum Retail Price<span class="notzerovalue">&nbsp;*</span></label>
                  <input type="number" class="form-control" [formControlName]="'maximumRetailPrice'" id=""
                    placeholder="">
                </div>
                <div class="form-group col-md-2">
                  <label for="ProductDescription">Discount Price</label>
                  <input type="number" class="form-control" [formControlName]="'discountPrice'" id="" placeholder="">
                </div>

                <div class="form-group col-md-2">
                  <label for="inputPassword4">Promotion Price</label>
                  <input type="number" class="form-control" [formControlName]="'promotionPrice'" id="" placeholder="">
                </div>
                <div class="form-group col-md-2">
                  <label for="inputPassword4">Promotion Percentage</label>
                  <input type="number" class="form-control" [formControlName]="'promotionPrecentage'" id=""
                    placeholder="">
                </div>
                <div class="form-group col-md-2">
                  <label for="inputPassword4">Tax Percentage</label>
                  <input type="number" class="form-control" [formControlName]="'taxPrecentage'" id="" placeholder="">
                </div>

                <div class="form-group col-md-12">
                  <div class="form-check">
                    <input class="form-check-input" [formControlName]="'active'" type="checkbox" value=""
                      id="invalidCheck3" [ngClass]="{ 'is-invalid': f.active.hasError('required') }">
                    <label class="form-check-label" for="">
                      Active
                    </label>
                    <div class="invalid-feedback" *ngIf="f.active.hasError('required')">
                      Please click checkbox.
                    </div>
                  </div>
                </div>
              </div>
              <button [disabled]="!addPriceForm.valid" type="submit" class="btn btn-primary ">Save</button>
              <button type="reset" class="btn btn-danger">Cancel</button>
              <!--
              <div class="form-group">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="gridCheck">
                  <label class="form-check-label" for="gridCheck">
                    Check me out
                  </label>
                </div>
              </div> -->

            </form>

          </div>
        </div>
